<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Rounded Base Plate -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  <!-- Clock Outer Ring -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="url(#emeraldGrad)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Clock Center Dot -->
  <circle cx="32" cy="32" r="3" fill="#34D399"/>
  <!-- Clock Hour Hand -->
  <line x1="32" y1="32" x2="21" y2="32" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round"/>
  <!-- Clock Minute Hand -->
  <line x1="32" y1="32" x2="32" y2="18" stroke="#34D399" stroke-width="2.5" stroke-linecap="round"/>
</svg>
