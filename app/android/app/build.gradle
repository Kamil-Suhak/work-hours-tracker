plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.workhours.tracker"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.workhours.tracker"
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            def envKeystore = System.getenv("KEYSTORE_PATH")
            def keyPropsFile = file("key.properties").exists() ? file("key.properties") : rootProject.file("key.properties")

            if (envKeystore && file(envKeystore).exists()) {
                storeFile = file(envKeystore)
                storePassword = System.getenv("KEYSTORE_PASSWORD")
                keyAlias = System.getenv("KEY_ALIAS")
                keyPassword = System.getenv("KEY_PASSWORD")
            } else if (keyPropsFile.exists()) {
                def keyProps = new Properties()
                keyProps.load(new FileInputStream(keyPropsFile))
                storeFile = file(keyProps['storeFile'])
                storePassword = keyProps['storePassword']
                keyAlias = keyProps['keyAlias']
                keyPassword = keyProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            def isConfigured = signingConfigs.release.storeFile != null && signingConfigs.release.storeFile.exists()
            signingConfig = isConfigured ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}