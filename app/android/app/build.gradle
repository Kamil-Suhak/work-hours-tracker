plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.workhours.tracker"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.workhours.tracker"
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            def envKeystore = System.getenv("KEYSTORE_PATH")
            def keyPropsFile = file("key.properties").exists() ? file("key.properties") : rootProject.file("key.properties")

            File keystoreFile = null
            if (envKeystore) {
                if (file(envKeystore).exists()) {
                    keystoreFile = file(envKeystore)
                } else if (file("app/$envKeystore").exists()) {
                    keystoreFile = file("app/$envKeystore")
                } else if (rootProject.file(envKeystore).exists()) {
                    keystoreFile = rootProject.file(envKeystore)
                }
            }

            if (keystoreFile != null) {
                storeFile = keystoreFile
                storePassword = System.getenv("KEYSTORE_PASSWORD")
                keyAlias = System.getenv("KEY_ALIAS")
                keyPassword = System.getenv("KEY_PASSWORD")
            } else if (keyPropsFile.exists()) {
                def keyProps = new Properties()
                keyProps.load(new FileInputStream(keyPropsFile))
                storeFile = file(keyProps['storeFile'])
                storePassword = keyProps['storePassword']
                keyAlias = keyProps['keyAlias']
                keyPassword = keyProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def buildingRelease = graph.allTasks.any { task ->
        def name = task.name.toLowerCase()
        name.contains("release") && (
            name.contains("assemble") ||
            name.contains("bundle") ||
            name.contains("package") ||
            name.contains("sign")
        )
    }
    if (buildingRelease) {
        def releaseSigning = android.signingConfigs.release
        if (releaseSigning.storeFile == null || !releaseSigning.storeFile.exists()) {
            throw new GradleException(
                "Release signing keystore is missing or not configured. Provide KEYSTORE_PATH/KEYSTORE_PASSWORD/KEY_ALIAS/KEY_PASSWORD or key.properties."
            )
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}