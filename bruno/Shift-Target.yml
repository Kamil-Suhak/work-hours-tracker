info:
  name: Shift Target
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{baseUrl}}/api/v1/shift/target"
  body:
    type: json
    data: |-
      {
        "deltaMinutes": 10
      }
  auth:
    type: bearer
    token: "{{deviceToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true