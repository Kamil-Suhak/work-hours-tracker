info:
  name: Clock In
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/v1/clock-in"
  body:
    type: json
    data: |-
      {
        "requestId": "req-{{$guid}}",
        "source": "flutter_app"
      }
  auth:
    type: bearer
    token: "{{deviceToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
